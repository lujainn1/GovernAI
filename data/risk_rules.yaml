risk_rules:
- id: RISK-001
  category: data_sensitivity
  description: Processes sensitive personal data (health, biometric, financial, government
    ID, children's data).
  weight: 25
  trigger_keywords:
  - health
  - medical
  - biometric
  - financial
  - credit score
  - ssn
  - social security
  - government id
  - children
  - minors
- id: RISK-002
  category: autonomy
  description: Operates with full autonomy and can take actions without human review.
  weight: 25
  trigger_keywords:
  - fully autonomous
  - no human review
  - autonomous agent
  - self-executing
  - auto-approve
- id: RISK-003
  category: consequential_decisions
  description: Materially influences decisions about employment, lending, housing,
    healthcare access, or legal rights.
  weight: 25
  trigger_keywords:
  - hiring
  - employment decision
  - lending
  - loan approval
  - credit decision
  - housing
  - eviction
  - insurance claim
  - legal
  - immigration
  - parole
- id: RISK-004
  category: external_exposure
  description: Customer-facing or public-facing system with direct external user interaction.
  weight: 15
  trigger_keywords:
  - customer-facing
  - public-facing
  - external users
  - chatbot for customers
  - public api
- id: RISK-005
  category: third_party_dependency
  description: Relies on third-party or externally hosted models/data with unclear
    data-handling terms.
  weight: 10
  trigger_keywords:
  - third-party model
  - external vendor
  - external api
  - unverified data source
- id: RISK-006
  category: system_access
  description: Has permissions to modify, delete, or move data/funds, or to call other
    systems and tools.
  weight: 20
  trigger_keywords:
  - delete
  - write access
  - modify records
  - transfer funds
  - execute code
  - tool use
  - api access
  - admin access
- id: RISK-007
  category: scale
  description: Large-scale deployment affecting many users or high transaction volume.
  weight: 10
  trigger_keywords:
  - large-scale
  - millions of users
  - high volume
  - company-wide
  - enterprise-wide
- id: RISK-008
  title: Cross-Border Personal Data Processing
  category: data_sensitivity
  severity: High
  condition: The AI system processes, stores, or transfers personal data outside Saudi
    Arabia or through an external provider whose data processing location is outside
    Saudi Arabia
  action: Activate cross-border data transfer and third-party processing controls,
    require confirmation of the processing location and applicable safeguards, and
    route the use case for compliance review before approval.
- id: R-01
  title: Personal-data exposure
  domain: Data
  category: data
  description: Use case processes identifiable individuals
  treatment: Minimize data, legal basis, access/security, PDPL review
  weight: 15
  trigger_keywords:
  - personal data
  - identifiable individuals
  - pii
  source_refs:
  - S2
  - S3
- id: R-02
  title: Sensitive-data misuse
  domain: Data
  category: data
