  - {id: PID.3, module: AI_ETHICS, phase: prepare_data, principle: "Privacy & Security", control: "Identify personal/sensitive data and minimize its use for training or operation.", question: "Is personal/sensitive data identified and its use minimized for training or operation?", evidence_required: ["PII/sensitive-data inventory and minimization"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PID.4, module: AI_ETHICS, phase: prepare_data, principle: "Privacy & Security", control: "Control personal-data use, including consent/withdrawal where applicable.", question: "Is personal-data use controlled, including consent/withdrawal where applicable?", evidence_required: ["Lawful-use/consent controls"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PID.5, module: AI_ETHICS, phase: prepare_data, principle: "Privacy & Security", control: "Protect confidentiality, privacy, integrity, and security even under adversarial conditions.", question: "Are confidentiality, privacy, integrity, and security protected even under adversarial conditions?", evidence_required: ["Security testing / controls"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PID.6, module: AI_ETHICS, phase: prepare_data, principle: "Privacy & Security", control: "Assess the quality and provenance of acquired data.", question: "Has the quality and provenance of acquired data been assessed?", evidence_required: ["Source/provenance and quality review"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
