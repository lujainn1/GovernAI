  - {id: PID.8, module: AI_ETHICS, phase: prepare_data, principle: "Fairness", control: "Review dataset diversity and inclusion.", question: "Has dataset diversity and inclusion been reviewed?", evidence_required: ["Representativeness assessment"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PID.9, module: AI_ETHICS, phase: prepare_data, principle: "Accountability & Responsibility", control: "Verify integrity, quality, accuracy, provenance, and currency of collected data.", question: "Has the integrity, quality, accuracy, provenance, and currency of collected data been verified?", evidence_required: ["Data quality sign-off"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PID.10, module: AI_ETHICS, phase: prepare_data, principle: "Fairness", control: "Analyze proxy variables that may indirectly encode sensitive attributes.", question: "Have proxy variables that may indirectly encode sensitive attributes been analyzed?", evidence_required: ["Proxy-variable analysis"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PID.11, module: AI_ETHICS, phase: prepare_data, principle: "Humanity", control: "Verify data classification, processing, access, and acquisition are appropriate.", question: "Have data classification, processing, access, and acquisition been verified as appropriate?", evidence_required: ["Data handling/acquisition review"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PID.12, module: AI_ETHICS, phase: prepare_data, principle: "Humanity", control: "Validate that data/model design respects fundamental rights and Saudi cultural values.", question: "Does the data/model design respect fundamental rights and Saudi cultural values?", evidence_required: ["Rights/culture validation"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PID.13, module: AI_ETHICS, phase: prepare_data, principle: "Social & Environmental Benefits", control: "Classify data according to SDAIA recommendations or document the alternative standard used.", question: "Is data classified according to SDAIA recommendations, or is the alternative standard documented?", evidence_required: ["Data classification evidence"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PID.14, module: AI_ETHICS, phase: prepare_data, principle: "Reliability & Safety", control: "Measure data-sample quality, accuracy, relevance, and credibility.", question: "Has data-sample quality, accuracy, relevance, and credibility been measured?", evidence_required: ["Data quality metrics"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}

  # ============================== AI ETHICS: BUILD & VALIDATE (BV.1-13) ======
