  - {id: BV.2, module: AI_ETHICS, phase: build_validate, principle: "Reliability & Safety", control: "Define and test actions to take when the AI system fails.", question: "Are failure-response actions defined and tested?", evidence_required: ["Failure-response procedure"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: BV.3, module: AI_ETHICS, phase: build_validate, principle: "Reliability & Safety", control: "Define and test how failure conditions are detected across contexts.", question: "Is failure detection defined and tested across contexts?", evidence_required: ["Failure detection tests"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: BV.4, module: AI_ETHICS, phase: build_validate, principle: "Reliability & Safety", control: "Communicate evidence of system reliability to end-users.", question: "Is evidence of system reliability communicated to end-users?", evidence_required: ["Reliability communication"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: BV.5, module: AI_ETHICS, phase: build_validate, principle: "Transparency & Explainability", control: "Provide understandable reasons for AI outcomes and decisions.", question: "Are understandable reasons provided for AI outcomes and decisions?", evidence_required: ["Decision explanation"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: BV.6, module: AI_ETHICS, phase: build_validate, principle: "Transparency & Explainability", control: "Prefer an interpretable model/design where appropriate.", question: "Was an interpretable model/design preferred where appropriate?", evidence_required: ["Model interpretability rationale"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: BV.7, module: AI_ETHICS, phase: build_validate, principle: "Transparency & Explainability", control: "Evaluate interpretability after model training.", question: "Was interpretability evaluated after model training?", evidence_required: ["Interpretability test"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: BV.8, module: AI_ETHICS, phase: build_validate, principle: "Fairness", control: "Evaluate tools/techniques that improve understanding of data, model, and performance.", question: "Were tools/techniques used to improve understanding of data, model, and performance?", evidence_required: ["Model/data understanding evidence"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: BV.9, module: AI_ETHICS, phase: build_validate, principle: "Fairness", control: "Quantitatively test bias/fairness and protect groups from disproportionate negative effects.", question: "Has bias/fairness been quantitatively tested, protecting groups from disproportionate negative effects?", evidence_required: ["Bias metrics and mitigation"], critical: true, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: BV.10, module: AI_ETHICS, phase: build_validate, principle: "Social & Environmental Benefits", control: "Assess anthropomorphic design and avoid misleading users into treating the system as sentient.", question: "Has anthropomorphic design been assessed to avoid misleading users into treating the system as sentient?", evidence_required: ["Anthropomorphism review"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: BV.11, module: AI_ETHICS, phase: build_validate, principle: "Accountability & Responsibility", control: "Require stakeholder approval after successful testing and UAT before production.", question: "Is stakeholder approval required after successful testing and UAT, before production?", evidence_required: ["Test/UAT sign-off"], critical: true, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: BV.12, module: AI_ETHICS, phase: build_validate, principle: "Fairness", control: "Justify any use of sensitive attributes or proxies in the model.", question: "Is any use of sensitive attributes or proxies in the model justified?", evidence_required: ["Sensitive-feature justification"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: BV.13, module: AI_ETHICS, phase: build_validate, principle: "Humanity", control: "Ensure algorithmic decision-making aligns with human rights and Saudi cultural values.", question: "Does the algorithmic decision-making align with human rights and Saudi cultural values?", evidence_required: ["Rights/culture design evidence"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}

  # ============================== AI ETHICS: DEPLOY & MONITOR (DM.1-20) ======
