# SDAIA-derived AI governance control library, used by the deterministic
# control router (app/tools/control_router.py) and evaluated by the Policy
# Compliance Agent. Source IDs (PD.*, PID.*, BV.*, DM.*, PDPL-*, XFER-*,
# GEN-*) are preserved from the official AI Ethics Checklist / PDPL /
# Transfer Regulation / GenAI Guidelines so they remain stable identifiers.
# Control text, questions, and evidence suggestions are implementation
# paraphrases, not official legal wording - verify against the current
# official SDAIA documents before production use.
#
# Fields:
#   module        AI_ETHICS | PDPL | XFER | GEN
#   phase         plan_design | prepare_data | build_validate | deploy_monitor
#                 (AI_ETHICS only; null for the other modules)
#   applies_when  list of use-case conditions that activate this control.
#                 Empty list = always evaluated (AI_ETHICS base, non-DM
#                 phases). See app/tools/control_router.py for how these
#                 conditions map to AIUseCase fields.
#   critical      failing a critical control can drive the Decision Agent
#                 toward block/human-review regardless of overall risk level.
#
# Source basis: S2 (AI Ethics Principles v1.0, Annexure C - 75 controls),
# S5/S6/S7 (PDPL + Implementing Regulations + Minimum Data Guideline),
# S8 (Transfer Regulation), S9 (Generative AI Guidelines).

controls:
  # ============================== AI ETHICS: PLAN & DESIGN (PD.1-28) =========
  - {id: PD.1, module: AI_ETHICS, phase: plan_design, principle: "Accountability & Responsibility", control: "Define an appropriate level of human oversight for the AI use case.", question: "Is an appropriate level of human oversight defined for this use case?", evidence_required: ["Oversight design / RACI"], critical: true, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.2, module: AI_ETHICS, phase: plan_design, principle: "Accountability & Responsibility", control: "Prevent overreliance on AI by providing meaningful human intervention.", question: "Does the design provide meaningful human intervention to prevent overreliance on the AI?", evidence_required: ["Human intervention mechanism"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.3, module: AI_ETHICS, phase: plan_design, principle: "Accountability & Responsibility", control: "Define oversight processes, KPIs, and responsible parties.", question: "Are oversight processes, KPIs, and responsible parties defined?", evidence_required: ["Oversight KPIs and owners"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.4, module: AI_ETHICS, phase: plan_design, principle: "Accountability & Responsibility", control: "Define how authorized users can stop, override, or intervene when the system behaves incorrectly.", question: "Is there a defined procedure for authorized users to stop, override, or intervene?", evidence_required: ["Abort/override procedure"], critical: true, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.5, module: AI_ETHICS, phase: plan_design, principle: "Accountability & Responsibility", control: "Address liability and protection of affected data subjects.", question: "Has liability and protection of affected data subjects been addressed?", evidence_required: ["Liability/data-subject assessment"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.6, module: AI_ETHICS, phase: plan_design, principle: "Accountability & Responsibility", control: "Set KPI thresholds and fallback triggers for alternative actions.", question: "Are KPI thresholds and fallback triggers defined?", evidence_required: ["Threshold/fallback rules"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.7, module: AI_ETHICS, phase: plan_design, principle: "Accountability & Responsibility", control: "Provide accountability-related training and education.", question: "Is accountability-related training provided to relevant staff?", evidence_required: ["Training record"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.8, module: AI_ETHICS, phase: plan_design, principle: "Accountability & Responsibility", control: "Align the AI governance structure with the applicable national AI ethics governance mechanism.", question: "Is the AI governance structure aligned with the applicable national AI ethics governance mechanism?", evidence_required: ["Governance mapping"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.9, module: AI_ETHICS, phase: plan_design, principle: "Accountability & Responsibility", control: "Include internal or external audit mechanisms in the governance structure.", question: "Does the governance structure include internal or external audit mechanisms?", evidence_required: ["Audit plan"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.10, module: AI_ETHICS, phase: plan_design, principle: "Fairness", control: "Establish a strategy to prevent or reduce unfair bias in both data and algorithm design.", question: "Is there a strategy to prevent or reduce unfair bias in data and algorithm design?", evidence_required: ["Bias prevention plan"], critical: true, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.11, module: AI_ETHICS, phase: plan_design, principle: "Fairness", control: "Identify sensitive attributes and disadvantaged groups; define fairness thresholds.", question: "Are sensitive attributes and disadvantaged groups identified, with fairness thresholds defined?", evidence_required: ["Sensitive-attribute inventory / thresholds"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.12, module: AI_ETHICS, phase: plan_design, principle: "Fairness", control: "Define measurable fairness KPIs.", question: "Are measurable fairness KPIs defined?", evidence_required: ["Fairness metrics"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.13, module: AI_ETHICS, phase: plan_design, principle: "Fairness", control: "Include relevant stakeholders in AI system development and use.", question: "Are relevant stakeholders included in the system's development and use?", evidence_required: ["Stakeholder participation record"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.14, module: AI_ETHICS, phase: plan_design, principle: "Humanity", control: "Assess impacts on fundamental rights and Saudi cultural values; define recovery measures.", question: "Have impacts on fundamental rights and Saudi cultural values been assessed, with recovery measures defined?", evidence_required: ["Human-rights/cultural impact assessment"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.15, module: AI_ETHICS, phase: plan_design, principle: "Humanity", control: "Prevent deception and unjustified impairment of users' freedom of choice.", question: "Does the design prevent deception and unjustified impairment of users' freedom of choice?", evidence_required: ["Anti-deception / autonomy controls"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.16, module: AI_ETHICS, phase: plan_design, principle: "Privacy & Security", control: "Map the system to relevant standards, laws, policies, and protocols.", question: "Is the system mapped to relevant standards, laws, policies, and protocols?", evidence_required: ["Compliance/standards mapping"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.17, module: AI_ETHICS, phase: plan_design, principle: "Privacy & Security", control: "Use formal data-governance procedures and applicable national data/privacy standards.", question: "Are formal data-governance procedures and applicable national data/privacy standards used?", evidence_required: ["Data-governance procedures"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.18, module: AI_ETHICS, phase: plan_design, principle: "Privacy & Security", control: "Implement access controls that satisfy security/privacy needs and maintain logs for audit/debugging.", question: "Are access controls implemented with logs maintained for audit/debugging?", evidence_required: ["IAM controls and audit logging"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.19, module: AI_ETHICS, phase: plan_design, principle: "Reliability & Safety", control: "Define an AI risk-management strategy with tiers, KPIs, assessment, treatment, and mitigation.", question: "Is an AI risk-management strategy defined, covering tiers, KPIs, assessment, treatment, and mitigation?", evidence_required: ["Risk-management plan"], critical: true, applies_when: [], source_refs: [SDAIA_AI_ETHICS, SDAIA_AI_RMF]}
  - {id: PD.20, module: AI_ETHICS, phase: plan_design, principle: "Reliability & Safety", control: "Assess potential harm, affected parties, likelihood, and severity.", question: "Has potential harm, affected parties, likelihood, and severity been assessed?", evidence_required: ["Harm assessment"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.21, module: AI_ETHICS, phase: plan_design, principle: "Reliability & Safety", control: "Assess likelihood of inaccurate results, failures, or reinforcement of societal bias.", question: "Has the likelihood of inaccurate results, failures, or reinforcement of societal bias been assessed?", evidence_required: ["Failure/inaccuracy assessment"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.22, module: AI_ETHICS, phase: plan_design, principle: "Social & Environmental Benefits", control: "Assess potential harm to society, the environment, living creatures, and affected persons.", question: "Has potential harm to society, the environment, and affected persons been assessed?", evidence_required: ["Social/environmental impact assessment"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.23, module: AI_ETHICS, phase: plan_design, principle: "Transparency & Explainability", control: "Confirm the AI business model aligns with organizational mission, vision, and code of conduct.", question: "Does the AI use case align with the organization's mission, vision, and code of conduct?", evidence_required: ["Business alignment evidence"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.24, module: AI_ETHICS, phase: plan_design, principle: "Transparency & Explainability", control: "Design the system so relevant data, algorithms, outputs, and decisions can be explained.", question: "Is the system designed so its data, algorithms, outputs, and decisions can be explained?", evidence_required: ["Interpretability/explainability design"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.25, module: AI_ETHICS, phase: plan_design, principle: "Transparency & Explainability", control: "Design user experience to reduce confusion, confirmation bias, and cognitive fatigue.", question: "Is the user experience designed to reduce confusion, confirmation bias, and cognitive fatigue?", evidence_required: ["UX risk review"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.26, module: AI_ETHICS, phase: plan_design, principle: "Fairness", control: "Document material trade-offs made during system design.", question: "Are material design trade-offs documented?", evidence_required: ["Trade-off log"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.27, module: AI_ETHICS, phase: plan_design, principle: "Privacy & Security", control: "Establish a privacy-impact assessment mechanism.", question: "Is a privacy-impact assessment mechanism established?", evidence_required: ["Privacy impact assessment"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}
  - {id: PD.28, module: AI_ETHICS, phase: plan_design, principle: "Humanity", control: "Review the data-management approach against human-centric values and Saudi data regulations.", question: "Has the data-management approach been reviewed against human-centric values and Saudi data regulations?", evidence_required: ["Human-centric data-management review"], critical: false, applies_when: [], source_refs: [SDAIA_AI_ETHICS]}

