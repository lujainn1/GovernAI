  - {id: DM.3, module: AI_ETHICS, phase: deploy_monitor, principle: "Accountability & Responsibility", control: "Monitor inaccurate predictions and define unacceptable-error thresholds.", question: "Are inaccurate predictions monitored with unacceptable-error thresholds defined?", evidence_required: ["Error-rate threshold monitoring"], critical: true, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.4, module: AI_ETHICS, phase: deploy_monitor, principle: "Reliability & Safety", control: "Monitor whether the system continues meeting intended goals and uses.", question: "Is the system monitored to ensure it continues meeting its intended goals and uses?", evidence_required: ["Performance/purpose monitoring"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.5, module: AI_ETHICS, phase: deploy_monitor, principle: "Privacy & Security", control: "Ensure personnel with data access are competent in data-protection requirements.", question: "Are personnel with data access competent in data-protection requirements?", evidence_required: ["Access-role training/qualification"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.6, module: AI_ETHICS, phase: deploy_monitor, principle: "Transparency & Explainability", control: "Assess how strongly the AI influences end-user decisions.", question: "Has the strength of the AI's influence on end-user decisions been assessed?", evidence_required: ["Decision-influence assessment"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.7, module: AI_ETHICS, phase: deploy_monitor, principle: "Transparency & Explainability", control: "Explain reasons/criteria/benefits behind outputs and provide clear issue-escalation channels.", question: "Are reasons/criteria/benefits behind outputs explained, with clear issue-escalation channels?", evidence_required: ["User explanation and escalation process"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.8, module: AI_ETHICS, phase: deploy_monitor, principle: "Transparency & Explainability", control: "Collect end-user feedback and incorporate relevant feedback into system improvement.", question: "Is end-user feedback collected and incorporated into system improvement?", evidence_required: ["Feedback loop"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.9, module: AI_ETHICS, phase: deploy_monitor, principle: "Fairness", control: "Continuously monitor bias and fairness quantitatively in production.", question: "Is bias and fairness continuously monitored quantitatively in production?", evidence_required: ["Fairness monitoring"], critical: true, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.10, module: AI_ETHICS, phase: deploy_monitor, principle: "Fairness", control: "Assess how output variability may affect fundamental rights.", question: "Has the effect of output variability on fundamental rights been assessed?", evidence_required: ["Variability/rights assessment"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.11, module: AI_ETHICS, phase: deploy_monitor, principle: "Fairness", control: "Maintain operational mechanisms that protect fairness.", question: "Are operational mechanisms in place to protect fairness?", evidence_required: ["Fairness controls"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.12, module: AI_ETHICS, phase: deploy_monitor, principle: "Fairness", control: "Make AI-system information accessible to users of assistive technologies.", question: "Is AI-system information accessible to users of assistive technologies?", evidence_required: ["Accessibility evidence"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.13, module: AI_ETHICS, phase: deploy_monitor, principle: "Social & Environmental Benefits", control: "Monitor social and environmental impacts after deployment.", question: "Are social and environmental impacts monitored after deployment?", evidence_required: ["Social/environmental monitoring"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.14, module: AI_ETHICS, phase: deploy_monitor, principle: "Accountability & Responsibility", control: "Maintain mechanisms that protect fundamental human rights.", question: "Are mechanisms maintained that protect fundamental human rights?", evidence_required: ["Human-rights monitoring"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.15, module: AI_ETHICS, phase: deploy_monitor, principle: "Accountability & Responsibility", control: "Provide channels for workers/third parties to report vulnerabilities, risks, or bias.", question: "Are channels provided for workers/third parties to report vulnerabilities, risks, or bias?", evidence_required: ["Risk reporting channel"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.16, module: AI_ETHICS, phase: deploy_monitor, principle: "Accountability & Responsibility", control: "Maintain evidence demonstrating compliance with AI ethics principles.", question: "Is evidence maintained demonstrating compliance with AI ethics principles?", evidence_required: ["Compliance evidence pack"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.17, module: AI_ETHICS, phase: deploy_monitor, principle: "Accountability & Responsibility", control: "Provide redress mechanisms when harm or adverse impact occurs.", question: "Are redress mechanisms provided when harm or adverse impact occurs?", evidence_required: ["Redress mechanism"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.18, module: AI_ETHICS, phase: deploy_monitor, principle: "Accountability & Responsibility", control: "Inform users/third parties about available redress opportunities.", question: "Are users/third parties informed about available redress opportunities?", evidence_required: ["Redress notice"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.19, module: AI_ETHICS, phase: deploy_monitor, principle: "Privacy & Security", control: "Continuously monitor privacy and security after deployment.", question: "Are privacy and security continuously monitored after deployment?", evidence_required: ["Privacy/security monitoring"], critical: true, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}
  - {id: DM.20, module: AI_ETHICS, phase: deploy_monitor, principle: "Humanity", control: "Periodically reassess deployed AI for alignment with human rights and Saudi cultural values.", question: "Is deployed AI periodically reassessed for alignment with human rights and Saudi cultural values?", evidence_required: ["Periodic rights/culture review"], critical: false, applies_when: [deployment_status_production], source_refs: [SDAIA_AI_ETHICS]}

  # ============================== PDPL (PDPL-01 to 32) =======================
  # applies_when: [personal_data]
  - {id: PDPL-01, module: PDPL, phase: null, principle: "Scope & Inventory", control: "Identify whether the use case processes personal data directly or indirectly.", question: "Has it been determined whether the use case processes personal data directly or indirectly?", evidence_required: ["Data inventory / field list"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-02, module: PDPL, phase: null, principle: "Scope & Inventory", control: "Identify sensitive personal data and apply enhanced review.", question: "Is sensitive personal data identified, with enhanced review applied?", evidence_required: ["Sensitive-data inventory"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-03, module: PDPL, phase: null, principle: "Governance", control: "Identify controller, processor, and other recipient roles.", question: "Are the controller, processor, and other recipient roles identified?", evidence_required: ["Data-flow/RACI"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-04, module: PDPL, phase: null, principle: "Lawful Processing", control: "Document a lawful basis for each processing purpose.", question: "Is a lawful basis documented for each processing purpose?", evidence_required: ["Legal-basis record"], critical: true, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-05, module: PDPL, phase: null, principle: "Consent", control: "Where consent is the basis, ensure consent is valid and withdrawal can be handled.", question: "Where consent is relied upon, is it valid and can withdrawal be handled?", evidence_required: ["Consent record / withdrawal process"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-06, module: PDPL, phase: null, principle: "Transparency", control: "Provide a privacy notice describing collection, use, sharing, retention, and rights.", question: "Is a privacy notice provided describing collection, use, sharing, retention, and rights?", evidence_required: ["Privacy notice"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-07, module: PDPL, phase: null, principle: "Purpose Limitation", control: "Define and document a specific processing purpose.", question: "Is a specific processing purpose defined and documented?", evidence_required: ["RoPA / purpose statement"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-08, module: PDPL, phase: null, principle: "Purpose Compatibility", control: "Review any new/secondary use for compatibility or another valid legal route.", question: "Has any new/secondary use been reviewed for compatibility or another valid legal route?", evidence_required: ["Secondary-use assessment"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-09, module: PDPL, phase: null, principle: "Data Minimization", control: "Collect/process only data directly necessary for the purpose.", question: "Is only data directly necessary for the stated purpose collected/processed?", evidence_required: ["Field-to-purpose map"], critical: true, applies_when: [personal_data], source_refs: [SDAIA_PDPL, SDAIA_MIN_DATA]}
  - {id: PDPL-10, module: PDPL, phase: null, principle: "Data Minimization", control: "Avoid identifiers when the purpose can be achieved without identifying the person.", question: "Are identifiers avoided when the purpose can be achieved without identifying the person?", evidence_required: ["De-identification design"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_MIN_DATA]}
  - {id: PDPL-11, module: PDPL, phase: null, principle: "Accuracy", control: "Keep personal data accurate, complete, and up to date as required.", question: "Is personal data kept accurate, complete, and up to date as required?", evidence_required: ["Data-quality evidence"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-12, module: PDPL, phase: null, principle: "Retention", control: "Define retention periods tied to purpose and legal requirements.", question: "Are retention periods defined, tied to purpose and legal requirements?", evidence_required: ["Retention schedule"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-13, module: PDPL, phase: null, principle: "Destruction", control: "Securely destroy personal data when the purpose ends unless lawful retention applies.", question: "Is personal data securely destroyed once the purpose ends, unless lawful retention applies?", evidence_required: ["Destruction record"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL, SDAIA_MIN_DATA]}
  - {id: PDPL-14, module: PDPL, phase: null, principle: "Security", control: "Implement organizational, administrative, and technical safeguards.", question: "Are organizational, administrative, and technical safeguards implemented?", evidence_required: ["Security controls"], critical: true, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-15, module: PDPL, phase: null, principle: "Access Control", control: "Restrict access based on need-to-know and minimum privilege.", question: "Is access restricted based on need-to-know and minimum privilege?", evidence_required: ["IAM/RBAC evidence"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-16, module: PDPL, phase: null, principle: "Records", control: "Maintain an accurate and current Record of Processing Activities (RoPA).", question: "Is an accurate and current RoPA maintained?", evidence_required: ["RoPA"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-17, module: PDPL, phase: null, principle: "RoPA Content", control: "Record purposes, categories, recipients, retention, transfers, and security measures.", question: "Does the RoPA record purposes, categories, recipients, retention, transfers, and security measures?", evidence_required: ["Completed RoPA fields"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-18, module: PDPL, phase: null, principle: "Data Subject Rights", control: "Provide processes to handle applicable rights requests.", question: "Are processes in place to handle applicable data-subject rights requests?", evidence_required: ["Rights-request procedure/log"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-19, module: PDPL, phase: null, principle: "Correction", control: "Provide a process to correct incomplete, inaccurate, or outdated data.", question: "Is there a process to correct incomplete, inaccurate, or outdated data?", evidence_required: ["Correction workflow"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-20, module: PDPL, phase: null, principle: "Disclosure", control: "Document and validate the legal basis and scope of personal-data disclosure.", question: "Is the legal basis and scope of any personal-data disclosure documented and validated?", evidence_required: ["Disclosure request/record"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-21, module: PDPL, phase: null, principle: "Disclosure Minimization", control: "Disclose only the personal data necessary for the disclosure purpose.", question: "Is only the personal data necessary for the disclosure purpose actually disclosed?", evidence_required: ["Disclosure field list"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-22, module: PDPL, phase: null, principle: "Processors", control: "Ensure processors act under documented instructions and appropriate safeguards.", question: "Do processors act under documented instructions and appropriate safeguards?", evidence_required: ["Processor agreement / due diligence"], critical: false, applies_when: [personal_data, external_provider], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-23, module: PDPL, phase: null, principle: "Impact Assessment", control: "Conduct a data-protection impact assessment when required by the nature/scope/risk of processing.", question: "Has a DPIA been conducted where required by the nature/scope/risk of processing?", evidence_required: ["DPIA"], critical: true, applies_when: [personal_data, sensitive_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-24, module: PDPL, phase: null, principle: "Impact Assessment", control: "Assess nature, sources, scope, necessity, proportionality, impacts, likelihood, and mitigation.", question: "Where a DPIA is triggered, does it assess nature, sources, scope, necessity, proportionality, impacts, likelihood, and mitigation?", evidence_required: ["DPIA content"], critical: false, applies_when: [personal_data, sensitive_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-25, module: PDPL, phase: null, principle: "Breach Management", control: "Maintain a process to detect, investigate, contain, and document personal-data breaches.", question: "Is there a process to detect, investigate, contain, and document personal-data breaches?", evidence_required: ["Incident/breach plan"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-26, module: PDPL, phase: null, principle: "Breach Notification", control: "Notify the competent authority when the legal notification conditions are met.", question: "Is there a process to notify the competent authority when legal notification conditions are met?", evidence_required: ["Notification record"], critical: true, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-27, module: PDPL, phase: null, principle: "Data Protection Officer", control: "Determine whether a DPO must be appointed and document the role when required.", question: "Has it been determined whether a DPO must be appointed, with the role documented when required?", evidence_required: ["DPO appointment / responsibilities"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-28, module: PDPL, phase: null, principle: "Privacy by Design", control: "Embed data protection and minimization into system design and collection mechanisms.", question: "Is data protection and minimization embedded into the system design and collection mechanisms?", evidence_required: ["Privacy-by-design checklist"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_MIN_DATA]}
  - {id: PDPL-29, module: PDPL, phase: null, principle: "Training", control: "Train personnel who collect/process personal data on applicable obligations.", question: "Are personnel who collect/process personal data trained on applicable obligations?", evidence_required: ["Training evidence"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_MIN_DATA, SDAIA_PDPL]}
  - {id: PDPL-30, module: PDPL, phase: null, principle: "Anonymization/Pseudonymization", control: "Use anonymization or pseudonymization where appropriate to reduce identification risk.", question: "Is anonymization or pseudonymization used where appropriate to reduce identification risk?", evidence_required: ["De-identification evidence"], critical: false, applies_when: [personal_data, sensitive_data], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-31, module: PDPL, phase: null, principle: "Research/Statistics", control: "For research/statistical processing, define purpose, minimize data, pseudonymize where possible, and protect rights.", question: "For research/statistical processing, is purpose defined, data minimized, pseudonymization used where possible, and rights protected?", evidence_required: ["Research processing assessment"], critical: false, applies_when: [personal_data, research_purpose], source_refs: [SDAIA_PDPL]}
  - {id: PDPL-32, module: PDPL, phase: null, principle: "Compliance Monitoring", control: "Periodically review personal-data processing and correct noncompliance.", question: "Is personal-data processing periodically reviewed, with noncompliance corrected?", evidence_required: ["Audit/review log"], critical: false, applies_when: [personal_data], source_refs: [SDAIA_PDPL, SDAIA_MIN_DATA]}

  # ============================== CROSS-BORDER TRANSFER (XFER-01 to 12) ======
  # applies_when: [personal_data, data_outside_ksa]
  - {id: XFER-01, module: XFER, phase: null, principle: "Cross-Border Scope", control: "Detect whether personal data is transferred, disclosed, or made accessible outside KSA.", question: "Has it been detected whether personal data is transferred, disclosed, or made accessible outside KSA?", evidence_required: ["Data-flow map"], critical: false, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}
  - {id: XFER-02, module: XFER, phase: null, principle: "Purpose & Legal Basis", control: "Document the purpose and legal basis for the external transfer/disclosure.", question: "Are the purpose and legal basis for the external transfer/disclosure documented?", evidence_required: ["Transfer assessment"], critical: false, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}
  - {id: XFER-03, module: XFER, phase: null, principle: "National/Vital Interests", control: "Confirm transfer does not conflict with national security, vital interests, or other Saudi law.", question: "Has it been confirmed the transfer does not conflict with national security, vital interests, or other Saudi law?", evidence_required: ["Legal/regulatory review"], critical: false, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}
  - {id: XFER-04, module: XFER, phase: null, principle: "Adequacy", control: "Determine whether destination provides an adequate level of personal-data protection.", question: "Has it been determined whether the destination provides an adequate level of personal-data protection?", evidence_required: ["Adequacy assessment"], critical: true, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}
  - {id: XFER-05, module: XFER, phase: null, principle: "Appropriate Safeguards", control: "If needed, use an approved safeguard such as SCCs, BCRs, or accreditation.", question: "If adequate protection is not available, is an approved safeguard (SCCs, BCRs, or accreditation) used?", evidence_required: ["Safeguard evidence"], critical: true, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}
  - {id: XFER-06, module: XFER, phase: null, principle: "Transfer Minimization", control: "Limit transferred data to the minimum necessary for the purpose.", question: "Is transferred data limited to the minimum necessary for the purpose?", evidence_required: ["Transferred-field map"], critical: false, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}
  - {id: XFER-07, module: XFER, phase: null, principle: "Transfer Risk Assessment", control: "Conduct a transfer risk assessment when required, including sensitive data on continuous/large-scale transfers.", question: "Has a transfer risk assessment been conducted where required (including for sensitive or large-scale transfers)?", evidence_required: ["Transfer risk assessment"], critical: false, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}
  - {id: XFER-08, module: XFER, phase: null, principle: "Risk Factors", control: "Assess processing nature/geography, safeguards, material/moral impacts, likelihood, and mitigation.", question: "Does the transfer risk assessment cover processing nature/geography, safeguards, material/moral impacts, likelihood, and mitigation?", evidence_required: ["Assessment record"], critical: false, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}
  - {id: XFER-09, module: XFER, phase: null, principle: "Subsequent Transfer", control: "Ensure onward/subsequent transfers remain subject to applicable protections.", question: "Do onward/subsequent transfers remain subject to applicable protections?", evidence_required: ["Contract/processor controls"], critical: false, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}
  - {id: XFER-10, module: XFER, phase: null, principle: "Safeguard Adequacy", control: "Review whether selected safeguards remain effective and sufficient.", question: "Are selected safeguards periodically reviewed for continued effectiveness and sufficiency?", evidence_required: ["Periodic safeguard review"], critical: false, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}
  - {id: XFER-11, module: XFER, phase: null, principle: "Stop Transfer", control: "Stop transfer/disclosure if required safeguards are not implemented or become inadequate.", question: "Is there a mechanism to stop transfer/disclosure if required safeguards are not implemented or become inadequate?", evidence_required: ["Stop-transfer procedure"], critical: true, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}
  - {id: XFER-12, module: XFER, phase: null, principle: "Transfer Records", control: "Record transfer destination, recipient, legal route, purpose, safeguards, and relevant retention/security details.", question: "Are transfer destination, recipient, legal route, purpose, safeguards, and retention/security details recorded?", evidence_required: ["RoPA/transfer log"], critical: false, applies_when: [personal_data, data_outside_ksa], source_refs: [SDAIA_TRANSFER_REG]}

  # ============================== GENERATIVE AI / LLM (GEN-01 to 12) =========
  # applies_when: [generative_ai]
  - {id: GEN-01, module: GEN, phase: null, principle: "Responsible Use", control: "Apply responsible-use and AI-ethics requirements to the GenAI use case.", question: "Are responsible-use and AI-ethics requirements applied to this GenAI use case?", evidence_required: ["GenAI use-case assessment"], critical: false, applies_when: [generative_ai], source_refs: [SDAIA_GENAI, SDAIA_AI_ETHICS]}
  - {id: GEN-02, module: GEN, phase: null, principle: "Input Data", control: "Classify and review prompts/inputs before sending data to a GenAI service.", question: "Are prompts/inputs classified and reviewed before being sent to a GenAI service?", evidence_required: ["Input-data classification"], critical: false, applies_when: [generative_ai], source_refs: [SDAIA_GENAI]}
  - {id: GEN-03, module: GEN, phase: null, principle: "Personal/Sensitive Data", control: "Prevent unauthorized or unnecessary submission of personal, sensitive, or classified information.", question: "Is unauthorized or unnecessary submission of personal, sensitive, or classified information to the GenAI service prevented?", evidence_required: ["Input filtering/redaction"], critical: true, applies_when: [generative_ai], source_refs: [SDAIA_GENAI, SDAIA_PDPL]}
  - {id: GEN-04, module: GEN, phase: null, principle: "Output Validation", control: "Require verification of material GenAI outputs before operational use.", question: "Is verification of material GenAI outputs required before operational use?", evidence_required: ["Human/automated validation record"], critical: false, applies_when: [generative_ai], source_refs: [SDAIA_GENAI]}
  - {id: GEN-05, module: GEN, phase: null, principle: "Hallucination/Misinformation", control: "Assess and mitigate inaccurate, fabricated, or misleading generated content.", question: "Are inaccurate, fabricated, or misleading generated outputs assessed and mitigated?", evidence_required: ["Grounding/evaluation tests"], critical: false, applies_when: [generative_ai], source_refs: [SDAIA_GENAI]}
  - {id: GEN-06, module: GEN, phase: null, principle: "Bias", control: "Test generated outputs for bias, discrimination, and stereotyping.", question: "Are generated outputs tested for bias, discrimination, and stereotyping?", evidence_required: ["Bias evaluation"], critical: false, applies_when: [generative_ai], source_refs: [SDAIA_AI_ETHICS, SDAIA_GENAI]}
  - {id: GEN-07, module: GEN, phase: null, principle: "Human Oversight", control: "Keep meaningful human oversight for sensitive or high-impact GenAI uses.", question: "Is meaningful human oversight kept for sensitive or high-impact GenAI uses?", evidence_required: ["Human approval step"], critical: true, applies_when: [generative_ai], source_refs: [SDAIA_AI_ETHICS, SDAIA_GENAI]}
  - {id: GEN-08, module: GEN, phase: null, principle: "Transparency", control: "Inform users when relevant that generated content or non-human interaction is involved.", question: "Are users informed when generated content or non-human interaction is involved?", evidence_required: ["Disclosure notice"], critical: false, applies_when: [generative_ai, user_facing_chat], source_refs: [SDAIA_GENAI]}
  - {id: GEN-09, module: GEN, phase: null, principle: "Security", control: "Assess provider, model, prompt, tool, and data-security risks.", question: "Have provider, model, prompt, tool, and data-security risks been assessed?", evidence_required: ["Security assessment"], critical: false, applies_when: [generative_ai, external_provider], source_refs: [SDAIA_GENAI, SDAIA_AI_ETHICS]}
  - {id: GEN-10, module: GEN, phase: null, principle: "Intellectual Property", control: "Review copyright, ownership, licensing, and content-rights risks.", question: "Have copyright, ownership, licensing, and content-rights risks been reviewed?", evidence_required: ["IP review"], critical: false, applies_when: [generative_ai], source_refs: [SDAIA_GENAI]}
  - {id: GEN-11, module: GEN, phase: null, principle: "Traceability", control: "Log prompts/actions/outputs at a level appropriate to risk and privacy.", question: "Are prompts/actions/outputs logged at a level appropriate to risk and privacy?", evidence_required: ["Audit log"], critical: false, applies_when: [generative_ai], source_refs: [SDAIA_AI_ETHICS, SDAIA_GENAI]}
  - {id: GEN-12, module: GEN, phase: null, principle: "Monitoring", control: "Monitor quality, safety, privacy, and model/provider changes after deployment.", question: "Are quality, safety, privacy, and model/provider changes monitored after deployment?", evidence_required: ["Monitoring dashboard/review"], critical: false, applies_when: [generative_ai, deployment_status_production], source_refs: [SDAIA_AI_ETHICS, SDAIA_ADOPTION]}
